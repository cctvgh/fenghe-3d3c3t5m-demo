const $ = s => document.querySelector(s);

function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function num(v) { return v == null || v === "" || isNaN(v) ? "—" : v; }
function pctLabel(v) { return v == null ? "—" : Number(v).toFixed(1) + "%"; }
function numLabel(v, d=2) { return v == null ? "—" : Number(v).toFixed(d); }
function sigClass(s) { return s === "买入" ? "sig-buy" : s === "卖出" ? "sig-sell" : s === "持有偏多" ? "sig-bullish" : "sig-hold"; }
function sigBg(s) { return s === "买入" ? "#e6f7ed;color:#1a7f4b" : s === "卖出" ? "#fde8e8;color:#c53030" : s === "持有偏多" ? "#e6f2fb;color:#2b6cb0" : "#fef4e6;color:#b7791f"; }
function hRevYoy(r) { return r.financials && r.financials[0] ? r.financials[0].rev_yoy : null; }

function buildOverview() {
  const codes = Object.keys(DEMO_DATA);
  let html = "";
  codes.forEach(code => {
    const r = DEMO_DATA[code];
    html += `<div class="overview-item" data-code="${code}" onclick="selectStock('${code}')">
      <div class="ov-name">${esc(r.name)}</div>
      <div class="ov-code">${code} · ${r.market === "HK" ? "港股" : r.market === "B" ? "B股" : "A股"}</div>
      <div class="ov-score" style="color:${r.score_total >= 6.5 ? '#1a7f4b' : r.score_total >= 5 ? '#2b6cb0' : '#b7791f'}">${r.score_total.toFixed(1)}</div>
      <div class="ov-sig" style="background:${sigBg(r.signal).split(';')[0]};color:${sigBg(r.signal).split(';')[1]}">${r.signal}</div>
    </div>`;
  });
  $("#overview").innerHTML = html;

  const sel = $("#stockSelect");
  codes.forEach(code => {
    const r = DEMO_DATA[code];
    const opt = document.createElement("option");
    opt.value = code;
    opt.textContent = `${code} ${r.name} · ${r.signal} · ${r.score_total.toFixed(1)}分`;
    sel.appendChild(opt);
  });
}

function selectStock(code) {
  $("#stockSelect").value = code;
  document.querySelectorAll(".overview-item").forEach(el => {
    el.classList.toggle("active", el.dataset.code === code);
  });
  const r = DEMO_DATA[code];
  if (r) render(r);
}

$("#go").addEventListener("click", () => { selectStock($("#stockSelect").value); });
$("#stockSelect").addEventListener("change", () => { selectStock($("#stockSelect").value); });

      <div class="qual-row"><span class="ql">ROE质量</span><span class="qv" style="font-weight:700;color:${r.dupont && r.dupont.quality === '硬核ROE' ? '#1a7f4b' : r.dupont && r.dupont.quality === '杠杆型ROE' ? '#c53030' : '#2b6cb0'}">${esc(r.dupont ? r.dupont.quality : "—")}</span></div>
      <div class="qual-row"><span class="ql">净利率</span><span class="qv">${r.dupont && r.dupont.margin != null ? r.dupont.margin + "%" : "—"}</span></div>
      <div class="qual-row"><span class="ql">权益乘数</span><span class="qv">${r.dupont && r.dupont.leverage != null ? r.dupont.leverage + "x" : "—"}</span></div>
      <div class="qual-detail">${esc(r.dupont ? r.dupont.verdict : "—")}</div>
    </div>
  </div>

  <div class="card">
    <h3>C3 证伪思维 <span class="tag">季报证明/证伪</span></h3>
    <div class="qual-box">
      <div class="qual-type" style="color:${r.thesis && r.thesis.trend === 'confirming' ? '#1a7f4b' : r.thesis && r.thesis.trend === 'falsifying' ? '#c53030' : '#b7791f'}">${esc(r.thesis ? r.thesis.status : "—")}</div>
      <div class="qual-detail">${esc(r.thesis ? r.thesis.detail : "—")}</div>
      <div class="qual-row" style="margin-top:6px"><span class="ql">证明信号</span><span class="qv" style="color:#1a7f4b;font-weight:600">${r.thesis ? r.thesis.confirm : 0} 个</span></div>
      <div class="qual-row"><span class="ql">证伪信号</span><span class="qv" style="color:${r.thesis && r.thesis.falsify > 0 ? '#c53030' : '#7a8ea3'};font-weight:600">${r.thesis ? r.thesis.falsify : 0} 个</span></div>
    </div>
  </div>

  <div class="card">
    <h3>人遛狗偏离度 <span class="tag">价格 vs 价值</span></h3>
    <div class="qual-box">
      <div class="qual-type" style="color:${r.leash && (r.leash.deviation === '极度滞后' || r.leash.deviation === '滞后') ? '#1a7f4b' : r.leash && (r.leash.deviation === '极度超前' || r.leash.deviation === '超前') ? '#c53030' : '#2b6cb0'}">${esc(r.leash ? r.leash.deviation : "—")}</div>
      <div class="qual-detail">${esc(r.leash ? r.leash.interp : "—")}</div>
      <div class="qual-row" style="margin-top:6px"><span class="ql">PE分位</span><span class="qv">${r.leash && r.leash.pe_percentile != null ? r.leash.pe_percentile + "%" : "—"}</span></div>
      <div class="qual-row"><span class="ql">vs MA60</span><span class="qv">${r.leash && r.leash.short_dev_pct != null ? (r.leash.short_dev_pct > 0 ? '+' : '') + r.leash.short_dev_pct + "%" : "—"}</span></div>
    </div>
  </div>

  <div class="card">
    <h3>风控纪律 <span class="tag">收益率只是风控的结果</span></h3>
    <div class="qual-box">
      <div class="qual-row"><span class="ql">止损线</span><span class="qv" style="font-weight:700;color:#c53030">${r.risk && r.risk.stop_loss != null ? r.risk.stop_loss + " 元 (-8%)" : "—"}</span></div>
      <div class="qual-row"><span class="ql">仓位上限</span><span class="qv" style="font-weight:700">${r.risk && r.risk.max_position != null ? r.risk.max_position + "%" : "—"}</span></div>
      <div class="risk-rules">${(r.risk && r.risk.rules || []).map(rule => '<div class="risk-rule">▸ ' + esc(rule) + '</div>').join("")}</div>
    </div>
  </div>

  <div class="card">
    <h3>行情与估值</h3>
    <table>
      <tr><th>最新价</th><th>涨跌幅</th><th>MA20</th><th>MA60</th><th>距52周高</th><th>PE(TTM)</th><th>PB</th><th>PE 3年分位</th><th>PB 3年分位</th><th>1月动量</th><th>1年动量</th></tr>
      <tr>
        <td>${num(h.price)}</td><td>${pctLabel(h.change_pct)}</td>
        <td>${num(h.ma20)}</td><td>${num(h.ma60)}</td>
        <td>${pctLabel(h.off_high_pct)}</td>
        <td>${num(h.pe_ttm)}</td><td>${num(h.pb)}</td>
        <td>${pctLabel(h.pe_pct_3y)}</td><td>${pctLabel(h.pb_pct_3y)}</td>
        <td>${pctLabel(h.mom_1m)}</td><td>${pctLabel(h.mom_1y)}</td>
      </tr>
    </table>
  </div>

  <div class="card">
    <h3>财务摘要（近 ${Math.min(8, (r.financials||[]).length)} 期）</h3>
    <div style="overflow-x:auto">
    <table>
      <tr><th>报告期</th><th>ROE%</th><th>净利率%</th><th>毛利率%</th><th>负债率%</th><th>营收增速%</th><th>净利增速%</th><th>EPS</th></tr>
      ${(r.financials || []).slice(0, 8).map(f => `<tr>
        <td>${esc(f.period||"")}</td><td>${num(f.roe)}</td><td>${num(f.net_margin)}</td>
        <td>${num(f.gross_margin)}</td><td>${num(f.debt_ratio)}</td>
        <td>${pctLabel(f.rev_yoy)}</td><td>${pctLabel(f.np_yoy)}</td><td>${num(f.eps)}</td>
      </tr>`).join("")}
    </table>
    </div>
  </div>

  <div class="card">
    <h3>3T 时间框架建议</h3>
    <div class="sub-grid">
      <div class="sub-item"><div class="k">T1（0-3月）</div><div class="v">${num(s.t1)}</div><div class="d">短期动量</div></div>
      <div class="sub-item"><div class="k">T2（3-15月）</div><div class="v">${num(s.t2)}</div><div class="d">业绩兑现</div></div>
      <div class="sub-item"><div class="k">T3（15月+）</div><div class="v">${num(s.t3)}</div><div class="d">长期ROE复利</div></div>
      <div class="sub-item" style="grid-column: span 2"><div class="k">胡猛心法</div><div class="d" style="font-size:12px; line-height:1.7">确定性是投资的唯一标准；风险控制是收益率的前提；跌破买入价 8% 止损观察，组合保持 20-40 只分散。</div></div>
    </div>
  </div>`;

  $("#result").innerHTML = html;
}

buildOverview();
selectStock(Object.keys(DEMO_DATA)[0]);
</script>
</body>
</html>
